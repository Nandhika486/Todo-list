<!DOCTYPE html>
<html>
  <head>
    <title>To do list</title>
    <link rel="stylesheet" href="index.css">
  </head>
<body>

  <div class="container">

  <h1>📝 My Todo List</h1>

  <div class="todo-input-grid">

    </button>
  </div>

  <div class="js-todo-list todo-grid"></div>

  </div>

  <script src="index.js"></script>

</body>
</html>
